<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pemeliharaan Sistem</title>
  <meta name="robots" content="noindex">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      max-width: 430px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .hero {
      background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
      color: white;
      padding: 32px 24px;
      text-align: center;
    }

    .hero .icon {
      font-size: 44px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .hero h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
    }

    .body {
      padding: 24px;
      text-align: center;
    }

    .body p {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: #475569;
    }

    .footer {
      padding: 0 24px 24px;
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="hero">
      <div class="icon">🛠️</div>
      <h1>Sedang Dalam Pemeliharaan</h1>
    </div>
    <div class="body">
      <p>{{ message }}</p>
    </div>
    <div class="footer">
      Terima kasih atas pengertian Anda.
    </div>
  </div>
</body>

</html>
